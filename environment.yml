      - pyg-lib==0.4.0+pt27cu126
      - torch-scatter==2.1.2+pt27cu126
      - torch-sparse==0.6.18+pt27cu126
      - numpy==2.1.2
      - pandas==2.3.1
      - pyarrow==21.0.0
      - scipy==1.15.3
      - scikit-learn==1.7.1
      - duckdb==1.3.2
      - PyYAML==6.0.2
      - huggingface-hub==0.34.3
      - sentence-transformers==5.1.0
      - transformers==4.55.0
      - safetensors==0.6.1
      - pytorch-frame==0.2.5
      - torch-geometric==2.6.1
      - tqdm==4.67.1
      - psutil==7.0.0
      - filelock==3.18.0
